services:
  dc-checker:
    build: .
    image: dc-network-checker:latest
    container_name: dc-network-checker
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/meta')"]
      interval: 15s
      timeout: 5s
      retries: 5
